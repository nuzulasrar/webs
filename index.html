<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Phone Slider Showcase</title>

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 35%, rgba(245, 166, 35, 0.18) 0%, #0e111a 55%, #06070a 100%);
            --accent-glow: rgba(255, 183, 3, 0.3);
            --glass-border: rgba(255, 255, 255, 0.12);
            --phone-width: min(300px, 70vw);
        }

        [data-theme="cyber"] {
            --bg-gradient: radial-gradient(circle at 50% 35%, rgba(6, 182, 212, 0.2) 0%, #0c1524 55%, #030712 100%);
            --accent-glow: rgba(56, 189, 248, 0.35);
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08) 0%, #12141a 55%, #050608 100%);
            --accent-glow: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            background: #06070a;
            background-image: var(--bg-gradient);
            overflow: hidden;
            perspective: 1200px;
            touch-action: none;
            transition: background-image 0.5s ease;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px 0;
        }

        /* Ambient Glow Behind Phone */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            width: 540px;
            height: 540px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
        }

        /* Top Info Bar & Reset */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 20;
        }

        .info-pill {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 7px 16px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .info-pill:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .app-title {
            font-weight: 600;
            color: #fff;
        }

        /* 3D Carousel Stage */
        .carousel-stage {
            position: relative;
            width: 100%;
            max-width: 1100px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            perspective-origin: 50% 50%;
            z-index: 10;
        }

        /* 3D Track Containing All Phones */
        .carousel-track {
            position: relative;
            width: var(--phone-width);
            aspect-ratio: 1 / 2;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
            margin: 0 auto;
        }

        /* Individual 3D Phone Item */
        .phone-item {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease, filter 0.5s ease;
        }

        /* 3D State: Focused Main Card in Center */
        .phone-item.state-active {
            z-index: 10;
            opacity: 1;
            filter: brightness(1) blur(0px);
            cursor: grab;
            pointer-events: auto;
        }

        .phone-item.state-active:active {
            cursor: grabbing;
        }

        /* 3D State: Preview Card to Left (Pushed further back to prevent overlap) */
        .phone-item.state-prev {
            transform: translateX(-310px) translateZ(-200px) rotateY(30deg) scale(0.68) !important;
            z-index: 5;
            opacity: 0.42;
            filter: brightness(0.65) blur(0.6px);
            cursor: pointer;
            pointer-events: auto;
        }

        .phone-item.state-prev:hover {
            opacity: 0.75;
            filter: brightness(0.85) blur(0px);
            transform: translateX(-300px) translateZ(-170px) rotateY(24deg) scale(0.72) !important;
        }

        /* 3D State: Preview Card to Right (Pushed further back to prevent overlap) */
        .phone-item.state-next {
            transform: translateX(310px) translateZ(-200px) rotateY(-30deg) scale(0.68) !important;
            z-index: 5;
            opacity: 0.42;
            filter: brightness(0.65) blur(0.6px);
            cursor: pointer;
            pointer-events: auto;
        }

        .phone-item.state-next:hover {
            opacity: 0.75;
            filter: brightness(0.85) blur(0px);
            transform: translateX(300px) translateZ(-170px) rotateY(-24deg) scale(0.72) !important;
        }

        /* 3D State: Hidden */
        .phone-item.state-hidden {
            transform: translateZ(-400px) scale(0.45) !important;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* 3D Card Inner Wrapper (for live rotation on active item) */
        .phone-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Front & Back Faces */
        .phone-face {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border-radius: 48px;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* Front Face (App Screen) */
        .face-front {
            transform: translateZ(8px);
        }

        .phone-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.6));
        }

        /* Back Face (Device Back Image Layer) */
        .face-back {
            transform: rotateY(180deg) translateZ(8px);
        }

        /* Dynamic Specular Light Glare */
        .glare {
            position: absolute;
            inset: 2% 4%;
            border-radius: 46px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 60%);
            mix-blend-mode: overlay;
            pointer-events: none;
            opacity: 0.7;
            transform: translateZ(12px);
        }

        /* Dynamic 360° Floor Shadow */
        .shadow {
            position: absolute;
            bottom: -35px;
            left: 50%;
            width: 80%;
            height: 35px;
            transform: translateX(-50%) rotateX(90deg) translateZ(-40px);
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.85) 0%, transparent 75%);
            filter: blur(14px);
            pointer-events: none;
            transform-style: preserve-3d;
        }

        /* Nav Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-50%) scale(1.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .nav-arrow:active {
            transform: translateY(-50%) scale(0.95);
        }

        .nav-prev {
            left: max(16px, calc(50% - var(--phone-width) * 1.35));
        }

        .nav-next {
            right: max(16px, calc(50% - var(--phone-width) * 1.35));
        }

        /* Bottom Controls: Pagination & Themes */
        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            z-index: 20;
        }

        /* Slider Pagination Dots */
        .slider-dots {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
        }

        .dot {
            width: 28px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dot.active {
            width: 44px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
        }

        /* Theme Switcher Bar */
        .theme-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 5px 12px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 999px;
        }

        .theme-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .theme-dot:hover {
            transform: scale(1.18);
        }

        .theme-dot.active {
            border-color: #ffffff;
            transform: scale(1.2);
        }

        .dot-gold {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .dot-cyber {
            background: linear-gradient(135deg, #38bdf8, #06b6d4);
        }

        .dot-dark {
            background: linear-gradient(135deg, #64748b, #334155);
        }

        /* Responsive Breakpoints: Tablet View (769px - 1024px) */
        @media (max-width: 1024px) and (min-width: 769px) {
            .phone-item.state-prev {
                transform: translateX(-240px) translateZ(-160px) rotateY(26deg) scale(0.64) !important;
            }

            .phone-item.state-next {
                transform: translateX(240px) translateZ(-160px) rotateY(-26deg) scale(0.64) !important;
            }

            .nav-prev {
                left: 12px;
            }

            .nav-next {
                right: 12px;
            }
        }

        /* Responsive Breakpoints: Smartphone View (<= 768px) */
        /* Only the main focused phone is shown; perfectly centered with symmetrical controls */
        @media (max-width: 768px) {
            :root {
                --phone-width: min(280px, 76vw);
            }

            body {
                padding: 16px 0;
                overflow-x: hidden;
            }

            .carousel-stage {
                width: 100%;
                max-width: 100vw;
                padding: 0 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .carousel-track {
                margin: 0 auto;
                left: 0;
                right: 0;
            }

            /* Hide preview phones on mobile screens */
            .phone-item.state-prev,
            .phone-item.state-next,
            .phone-item.state-hidden {
                opacity: 0 !important;
                visibility: hidden !important;
                pointer-events: none !important;
                transform: translateZ(-300px) scale(0.5) !important;
            }

            .phone-item.state-active {
                opacity: 1 !important;
                visibility: visible !important;
                pointer-events: auto !important;
                transform: translateX(0px) scale(1) !important;
                left: 0;
                right: 0;
                margin: auto;
            }

            .nav-prev {
                left: max(10px, calc(50% - var(--phone-width) / 2 - 54px));
                width: 44px;
                height: 44px;
            }

            .nav-next {
                right: max(10px, calc(50% - var(--phone-width) / 2 - 54px));
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Glow -->
    <div class="ambient-glow"></div>

    <!-- Top Info / Reset Bar -->
    <div class="top-bar">
        <div class="info-pill" id="resetBtn" title="Click to reset front view">
            <span class="app-title" id="appTitle">MAE &bull; Maybank</span>
            <span style="opacity:0.4;">|</span>
            <span>↻ Reset 3D View</span>
        </div>
    </div>

    <!-- 3D Carousel Stage -->
    <div class="carousel-stage" id="carouselStage">

        <!-- Previous Slide Button -->
        <button class="nav-arrow nav-prev" id="prevBtn" title="Previous Phone">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>

        <!-- 3D Track with Multiple Phones -->
        <div class="carousel-track" id="carouselTrack">

            <!-- Phone 1: Maybank MAE -->
            <div class="phone-item state-active" data-index="0">
                <div class="phone-card-inner">
                    <!-- Floor Shadow -->
                    <div class="shadow"></div>
                    <!-- Front Face -->
                    <div class="phone-face face-front">
                        <img src="phone.png" alt="Maybank MAE Mockup" class="phone-img" draggable="false">
                        <div class="glare glare-front"></div>
                    </div>
                    <!-- Back Face -->
                    <div class="phone-face face-back">
                        <img src="phone-back.png" alt="iPhone Back" class="phone-img" draggable="false">
                        <div class="glare glare-back"></div>
                    </div>
                </div>
            </div>

            <!-- Phone 2: Sunway Medical Centre -->
            <div class="phone-item state-next" data-index="1">
                <div class="phone-card-inner">
                    <!-- Floor Shadow -->
                    <div class="shadow"></div>
                    <!-- Front Face -->
                    <div class="phone-face face-front">
                        <img src="phone2.png" alt="Sunway Medical Centre Mockup" class="phone-img" draggable="false">
                        <div class="glare glare-front"></div>
                    </div>
                    <!-- Back Face -->
                    <div class="phone-face face-back">
                        <img src="phone-back.png" alt="iPhone Back" class="phone-img" draggable="false">
                        <div class="glare glare-back"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Next Slide Button -->
        <button class="nav-arrow nav-next" id="nextBtn" title="Next Phone">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>

    </div>

    <!-- Bottom Controls: Pagination & Themes -->
    <div class="bottom-controls">

        <!-- Slider Pagination Dots -->
        <div class="slider-dots">
            <div class="dot active" data-slide="0" title="MAE Banking App"></div>
            <div class="dot" data-slide="1" title="Sunway Medical Centre App"></div>
        </div>

        <!-- Theme Switcher -->
        <div class="theme-bar">
            <div class="theme-dot dot-gold active" data-theme="gold" title="Gold Luxury"></div>
            <div class="theme-dot dot-cyber" data-theme="cyber" title="Cyber Cyan"></div>
            <div class="theme-dot dot-dark" data-theme="dark" title="Studio Dark"></div>
        </div>

    </div>

    <script>
        // Slide Configurations
        const slides = [
            {
                title: "MAE • Maybank",
                theme: "gold"
            },
            {
                title: "Sunway Medical Centre",
                theme: "cyber"
            }
        ];

        let currentSlideIndex = 0;

        // DOM Elements
        const stage = document.getElementById('carouselStage');
        const phoneItems = document.querySelectorAll('.phone-item');
        const appTitle = document.getElementById('appTitle');
        const resetBtn = document.getElementById('resetBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const dots = document.querySelectorAll('.dot');
        const themeDots = document.querySelectorAll('.theme-dot');

        // Active 3D Rotation Physics State
        let targetRotX = 0;
        let targetRotY = 0;
        let currentRotX = 0;
        let currentRotY = 0;

        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let velocityY = 0;
        let lastX = 0;

        // Update Phone States across the 3D Carousel
        function updateCarouselPositions() {
            phoneItems.forEach((item) => {
                const index = parseInt(item.dataset.index);
                const diff = (index - currentSlideIndex + slides.length) % slides.length;

                item.classList.remove('state-active', 'state-prev', 'state-next', 'state-hidden');

                if (diff === 0) {
                    item.classList.add('state-active');
                } else if (diff === 1 || (diff === -(slides.length - 1))) {
                    item.classList.add('state-next');
                } else if (diff === slides.length - 1 || diff === -1) {
                    item.classList.add('state-prev');
                } else {
                    item.classList.add('state-hidden');
                }

                // Reset inner transform on inactive items
                if (diff !== 0) {
                    const inner = item.querySelector('.phone-card-inner');
                    if (inner) inner.style.transform = 'rotateX(0deg) rotateY(0deg)';
                }
            });

            // Update UI Title, Dots, and Theme
            const activeSlide = slides[currentSlideIndex];
            appTitle.textContent = activeSlide.title;

            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlideIndex);
            });

            setTheme(activeSlide.theme);

            // Reset rotation angles smoothly when changing slides
            targetRotX = 0;
            targetRotY = 0;
        }

        function goToSlide(index) {
            if (index < 0) index = slides.length - 1;
            if (index >= slides.length) index = 0;
            if (index === currentSlideIndex) return;

            currentSlideIndex = index;
            updateCarouselPositions();
        }

        // Navigation Button Listeners
        prevBtn.addEventListener('click', () => {
            goToSlide(currentSlideIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            goToSlide(currentSlideIndex + 1);
        });

        // Click on preview phone items to focus them
        phoneItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const index = parseInt(item.dataset.index);
                if (index !== currentSlideIndex) {
                    e.stopPropagation();
                    goToSlide(index);
                }
            });
        });

        // Pagination Dots Click
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                goToSlide(parseInt(dot.dataset.slide));
            });
        });

        // Keyboard Arrow Keys
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') goToSlide(currentSlideIndex - 1);
            if (e.key === 'ArrowRight') goToSlide(currentSlideIndex + 1);
            if (e.key === 'r' || e.key === 'R') { targetRotX = 0; targetRotY = 0; }
        });

        // Pointer Events for 3D Drag & Rotation on Active Phone
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.nav-arrow') || e.target.closest('.slider-dots') || e.target.closest('.theme-bar') || e.target.closest('.top-bar')) {
                return;
            }

            const activeItem = document.querySelector('.phone-item.state-active');
            if (activeItem && activeItem.contains(e.target)) {
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                lastX = e.clientX;
                velocityY = 0;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;

                velocityY = (e.clientX - lastX) * 0.5;
                lastX = e.clientX;

                // Full 360° rotation on the active card
                targetRotY += deltaX * 0.55;
                targetRotX -= deltaY * 0.35;
                targetRotX = Math.max(-40, Math.min(40, targetRotX));

                startX = e.clientX;
                startY = e.clientY;
            } else {
                // Subtle 3D tilt tracking on hover
                const activeItem = document.querySelector('.phone-item.state-active');
                if (activeItem) {
                    const rect = activeItem.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const normX = (e.clientX - centerX) / (window.innerWidth / 2);
                    const normY = (e.clientY - centerY) / (window.innerHeight / 2);

                    targetRotX = -normY * 18;
                }
            }

            // Update Glare sheen on active phone
            const activeItem = document.querySelector('.phone-item.state-active');
            if (activeItem) {
                const glareFront = activeItem.querySelector('.glare-front');
                const glareBack = activeItem.querySelector('.glare-back');
                const rad = (currentRotY * Math.PI) / 180;
                const lightX = Math.sin(rad);
                const glareAngle = Math.atan2(targetRotX, -lightX * 20) * (180 / Math.PI) + 90;
                const glareStyle = `linear-gradient(${glareAngle}deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 65%)`;

                if (glareFront) glareFront.style.background = glareStyle;
                if (glareBack) glareBack.style.background = glareStyle;
            }
        });

        window.addEventListener('pointerup', () => {
            isDragging = false;
        });

        // Reset to Front View
        resetBtn.addEventListener('click', () => {
            targetRotX = 0;
            targetRotY = 0;
        });

        // Double-click to reset angle
        stage.addEventListener('dblclick', () => {
            targetRotX = 0;
            targetRotY = 0;
        });

        // Smooth Lerp Physics Loop
        function animate() {
            if (!isDragging && Math.abs(velocityY) > 0.05) {
                targetRotY += velocityY;
                velocityY *= 0.92;
            }

            currentRotX += (targetRotX - currentRotX) * 0.1;
            currentRotY += (targetRotY - currentRotY) * 0.1;

            const activeItem = document.querySelector('.phone-item.state-active');
            if (activeItem) {
                const inner = activeItem.querySelector('.phone-card-inner');
                const shadow = activeItem.querySelector('.shadow');

                if (inner) {
                    inner.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;
                }

                if (shadow) {
                    const radY = (currentRotY * Math.PI) / 180;
                    const shadowScaleX = 0.65 + Math.abs(Math.cos(radY)) * 0.35;
                    const shadowSkew = -Math.sin(radY) * 25;
                    const shadowOpacity = 0.5 + Math.abs(Math.cos(radY)) * 0.35;

                    shadow.style.transform = `translateX(-50%) rotateX(90deg) skewX(${shadowSkew}deg) scaleX(${shadowScaleX}) translateZ(-40px)`;
                    shadow.style.opacity = shadowOpacity;
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // Theme Switcher Logic
        function setTheme(theme) {
            themeDots.forEach(d => {
                d.classList.toggle('active', d.dataset.theme === theme);
            });
            document.body.setAttribute('data-theme', theme);
        }

        themeDots.forEach(dot => {
            dot.addEventListener('click', () => {
                setTheme(dot.dataset.theme);
            });
        });

        // Initialize Carousel
        updateCarouselPositions();
    </script>
</body>

</html>

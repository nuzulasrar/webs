<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Phone Front View</title>
  
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 35%, rgba(245, 166, 35, 0.18) 0%, #0e111a 55%, #06070a 100%);
      --accent-glow: rgba(255, 183, 3, 0.3);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    [data-theme="cyber"] {
      --bg-gradient: radial-gradient(circle at 50% 35%, rgba(6, 182, 212, 0.2) 0%, #0c1524 55%, #030712 100%);
      --accent-glow: rgba(56, 189, 248, 0.35);
    }

    [data-theme="dark"] {
      --bg-gradient: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08) 0%, #12141a 55%, #050608 100%);
      --accent-glow: rgba(255, 255, 255, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #06070a;
      background-image: var(--bg-gradient);
      overflow: hidden;
      perspective: 1200px;
      touch-action: none;
      transition: background-image 0.5s ease;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Ambient Glow Behind Phone */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
      transition: background 0.5s ease;
    }

    /* 3D Stage & Card Container */
    .card-3d-wrap {
      position: relative;
      width: min(340px, 78vw);
      aspect-ratio: 1 / 2;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 10;
    }

    .card-3d-wrap:active {
      cursor: grabbing;
    }

    /* 3D Phone Element */
    .phone-card {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Phone Image */
    .phone-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.65));
      transform: translateZ(20px);
    }

    /* Dynamic Specular Light Glare */
    .glare {
      position: absolute;
      inset: 2% 4%;
      border-radius: 46px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 60%);
      mix-blend-mode: overlay;
      pointer-events: none;
      opacity: 0.7;
      transform: translateZ(24px);
    }

    /* Dynamic Realistic Floor Shadow */
    .shadow {
      position: absolute;
      bottom: -35px;
      left: 50%;
      width: 75%;
      height: 35px;
      transform: translateX(-50%) rotateX(90deg) translateZ(-40px);
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.8) 0%, transparent 75%);
      filter: blur(12px);
      pointer-events: none;
      transform-style: preserve-3d;
    }

    /* Theme Switcher Bar */
    .theme-bar {
      position: absolute;
      bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      z-index: 20;
    }

    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .theme-dot:hover {
      transform: scale(1.18);
    }

    .theme-dot.active {
      border-color: #ffffff;
      transform: scale(1.2);
    }

    .dot-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .dot-cyber { background: linear-gradient(135deg, #38bdf8, #06b6d4); }
    .dot-dark { background: linear-gradient(135deg, #64748b, #334155); }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="ambient-glow"></div>

  <!-- 3D Interactive Stage -->
  <div class="card-3d-wrap" id="cardWrap">
    <div class="phone-card" id="phoneCard">
      <!-- 3D Ground Shadow -->
      <div class="shadow" id="shadow"></div>
      
      <!-- Phone Image -->
      <img src="phone.png" alt="Phone Mockup" class="phone-img" draggable="false">
      
      <!-- Glare Light Reflection -->
      <div class="glare" id="glare"></div>
    </div>
  </div>

  <!-- Theme Switcher -->
  <div class="theme-bar">
    <div class="theme-dot dot-gold active" data-theme="gold" title="Gold Luxury"></div>
    <div class="theme-dot dot-cyber" data-theme="cyber" title="Cyber Cyan"></div>
    <div class="theme-dot dot-dark" data-theme="dark" title="Studio Dark"></div>
  </div>

  <script>
    const wrap = document.getElementById('cardWrap');
    const card = document.getElementById('phoneCard');
    const glare = document.getElementById('glare');
    const shadow = document.getElementById('shadow');
    const themeDots = document.querySelectorAll('.theme-dot');

    // 3D Physics State
    let targetRotX = 0;
    let targetRotY = 0;
    let currentRotX = 0;
    let currentRotY = 0;
    
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    // Pointer Down (Mouse click or finger touch down)
    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
    });

    // Pointer Move (Mouse hover OR drag rotation)
    window.addEventListener('pointermove', (e) => {
      if (isDragging) {
        // Drag to rotate with touch or mouse
        const deltaX = e.clientX - startX;
        const deltaY = e.clientY - startY;

        targetRotY += deltaX * 0.4;
        targetRotX -= deltaY * 0.4;

        // Soft limit rotation range for natural front view
        targetRotX = Math.max(-45, Math.min(45, targetRotX));
        targetRotY = Math.max(-50, Math.min(50, targetRotY));

        startX = e.clientX;
        startY = e.clientY;
      } else {
        // Hover 3D tilt tracking
        const rect = wrap.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const normX = (e.clientX - centerX) / (window.innerWidth / 2);
        const normY = (e.clientY - centerY) / (window.innerHeight / 2);

        targetRotY = normX * 22;
        targetRotX = -normY * 20;
      }

      // Dynamic glare sheen
      const angle = Math.atan2(targetRotX, -targetRotY) * (180 / Math.PI) + 90;
      glare.style.background = `linear-gradient(${angle}deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 65%)`;
    });

    // Pointer Up (Release drag)
    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    // Reset smoothly when cursor leaves window
    document.addEventListener('mouseleave', () => {
      isDragging = false;
      targetRotX = 0;
      targetRotY = 0;
    });

    // Smooth Lerp Render Loop
    function animate() {
      currentRotX += (targetRotX - currentRotX) * 0.1;
      currentRotY += (targetRotY - currentRotY) * 0.1;

      // Apply 3D rotation
      card.style.transform = `rotateX(${currentRotX}deg) rotateY(${currentRotY}deg)`;

      // Dynamic shadow deformation
      const shadowSkew = -currentRotY * 0.6;
      shadow.style.transform = `translateX(-50%) rotateX(90deg) skewX(${shadowSkew}deg) translateZ(-40px)`;

      requestAnimationFrame(animate);
    }

    animate();

    // Theme Switcher Logic
    themeDots.forEach(dot => {
      dot.addEventListener('click', () => {
        themeDots.forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        const theme = dot.dataset.theme;
        document.body.setAttribute('data-theme', theme);
      });
    });
  </script>
</body>
</html>
